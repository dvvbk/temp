name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rdzen:
    name: Testy profak-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: profak-tauri/crates/profak-core
      - run: cargo test --manifest-path profak-tauri/crates/profak-core/Cargo.toml

  frontend:
    name: Build frontendu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: profak-tauri/package-lock.json
      - run: npm ci
        working-directory: profak-tauri
      - run: npm run build
        working-directory: profak-tauri

  tauri:
    name: Kompilacja powłoki Tauri (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zależności systemowe WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: profak-tauri/src-tauri
      - run: cargo check --manifest-path profak-tauri/src-tauri/Cargo.toml
