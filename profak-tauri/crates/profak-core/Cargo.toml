[package]
name = "profak-core"
version = "0.1.0"
edition = "2021"
description = "Rdzeń logiki ProFak - model danych, baza SQLite, wyliczenia faktur"
license = "MIT"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "1"
genpdf = "0.2"
