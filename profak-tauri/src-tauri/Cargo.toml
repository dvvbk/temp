[package]
name = "profak-tauri"
version = "0.1.0"
edition = "2021"
description = "ProFak - prosty, darmowy program do fakturowania (port na Tauri)"
license = "MIT"

[lib]
name = "profak_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
profak-core = { path = "../crates/profak-core" }
